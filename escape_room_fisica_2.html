<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚛️ ESCAPE ROOM FISICA AVANZATA - Liceo Scientifico</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0e27 0%, #16213e 100%);
            color: #00ff88;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(10, 14, 39, 0.95);
            border: 2px solid #00ff88;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3), inset 0 0 20px rgba(0, 255, 136, 0.1);
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 0 0 30px rgba(0, 255, 136, 0.3), inset 0 0 20px rgba(0, 255, 136, 0.1);
            }
            50% {
                box-shadow: 0 0 40px rgba(0, 255, 136, 0.5), inset 0 0 30px rgba(0, 255, 136, 0.2);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #00ff88;
            padding-bottom: 20px;
        }

        .title {
            font-size: 2.5em;
            color: #00ff88;
            text-shadow: 0 0 10px #00ff88, 0 0 20px #0088ff;
            margin-bottom: 10px;
            letter-spacing: 2px;
            animation: glitch 2s ease-in-out infinite;
        }

        @keyframes glitch {
            0%, 100% { text-shadow: 0 0 10px #00ff88, 0 0 20px #0088ff; }
            50% { text-shadow: 0 0 20px #00ff88, 0 0 30px #0088ff, 0 0 40px #ff00ff; }
        }

        .subtitle {
            font-size: 1.1em;
            color: #0088ff;
            margin-top: 5px;
        }

        .difficulty-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .difficulty-btn {
            padding: 10px 20px;
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid #00ff88;
            color: #00ff88;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }

        .difficulty-btn:hover {
            background: rgba(0, 255, 136, 0.3);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }

        .difficulty-btn.active {
            background: linear-gradient(135deg, #00ff88, #0088ff);
            color: #0a0e27;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.6);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1em;
        }

        .timer {
            color: #ff6b6b;
            font-weight: bold;
            font-size: 1.3em;
            animation: timerPulse 1s ease-in-out infinite;
        }

        @keyframes timerPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .timer.critical {
            animation: criticalPulse 0.5s ease-in-out infinite;
            color: #ff00ff;
        }

        @keyframes criticalPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
        }

        .points-display {
            color: #ffaa00;
            font-size: 1.2em;
            font-weight: bold;
        }

        .progress-container {
            margin-bottom: 30px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .progress-bar {
            width: 100%;
            height: 25px;
            background: rgba(0, 136, 255, 0.2);
            border: 1px solid #0088ff;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #0088ff);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px #00ff88;
        }

        .level-indicator {
            display: inline-block;
            padding: 5px 15px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            border-radius: 5px;
            font-size: 0.85em;
        }

        .level-1 { border-color: #00ff88; color: #00ff88; }
        .level-2 { border-color: #0088ff; color: #0088ff; }
        .level-3 { border-color: #ff00ff; color: #ff00ff; }
        .level-4 { border-color: #ffaa00; color: #ffaa00; }

        .difficulty-badge {
            display: inline-block;
            padding: 3px 10px;
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid #00ff88;
            border-radius: 3px;
            font-size: 0.8em;
            margin-left: 10px;
        }

        .difficulty-badge.facile { border-color: #00ff88; color: #00ff88; }
        .difficulty-badge.medio { border-color: #ffaa00; color: #ffaa00; }
        .difficulty-badge.difficile { border-color: #ff6b6b; color: #ff6b6b; }

        .question-container {
            margin-top: 30px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question-number {
            font-size: 0.9em;
            color: #0088ff;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.3em;
            margin-bottom: 20px;
            line-height: 1.6;
            color: #00ff88;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            background: rgba(0, 255, 136, 0.05);
            border: 2px solid #0088ff;
            border-radius: 5px;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            font-size: 1.1em;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
            background: rgba(0, 255, 136, 0.1);
        }

        input[type="text"].correct {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
        }

        input[type="text"].error {
            border-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #00ff88, #0088ff);
            border: none;
            border-radius: 5px;
            color: #0a0e27;
            font-family: 'Courier New', monospace;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.6);
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        .feedback {
            margin-top: 15px;
            padding: 12px;
            border-radius: 5px;
            font-size: 1em;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .feedback.success {
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid #00ff88;
            color: #00ff88;
        }

        .feedback.error {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
        }

        .explanation {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 136, 255, 0.1);
            border: 1px solid #0088ff;
            border-radius: 5px;
            color: #0088ff;
            font-size: 0.95em;
            line-height: 1.6;
            animation: fadeIn 0.5s ease;
        }

        .explanation-title {
            font-weight: bold;
            color: #00ff88;
            margin-bottom: 8px;
        }

        .victory-screen {
            text-align: center;
            animation: victoryEntry 0.5s ease-out;
        }

        @keyframes victoryEntry {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .victory-emoji {
            font-size: 4em;
            margin: 20px 0;
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .victory-title {
            font-size: 2em;
            color: #00ff88;
            text-shadow: 0 0 15px #00ff88, 0 0 30px #ffaa00;
            margin: 20px 0;
            letter-spacing: 2px;
        }

        .victory-message {
            font-size: 1.2em;
            color: #0088ff;
            margin: 15px 0;
            line-height: 1.8;
        }

        .stats-final {
            margin-top: 30px;
            padding: 20px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            border-radius: 5px;
            font-size: 1.1em;
        }

        .stats-line {
            margin: 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ranking-table {
            width: 100%;
            margin-top: 30px;
            border-collapse: collapse;
            background: rgba(0, 136, 255, 0.1);
        }

        .ranking-table thead {
            background: rgba(0, 255, 136, 0.2);
        }

        .ranking-table th, .ranking-table td {
            padding: 12px;
            text-align: left;
            border: 1px solid #0088ff;
            color: #00ff88;
        }

        .ranking-table th {
            color: #ffaa00;
            font-weight: bold;
        }

        .ranking-table tr:hover {
            background: rgba(0, 255, 136, 0.1);
        }

        .restart-btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 1.1em;
        }

        .hidden {
            display: none;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .title {
                font-size: 1.8em;
            }

            .stats-bar {
                flex-direction: column;
                gap: 10px;
            }

            .stat {
                width: 100%;
                justify-content: space-between;
            }

            .difficulty-selector {
                flex-direction: column;
            }

            .difficulty-btn {
                width: 100%;
            }

            .ranking-table {
                font-size: 0.85em;
            }

            .ranking-table th, .ranking-table td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- SCHERMATA DIFFICOLTÀ -->
        <div class="screen active" id="difficultyScreen">
            <div class="header">
                <div class="title">⚛️ ESCAPE ROOM FISICA</div>
                <div class="subtitle">Scegli il livello di difficoltà!</div>
            </div>
            <div style="text-align: center; margin-top: 40px;">
                <p style="color: #0088ff; font-size: 1.2em; margin-bottom: 30px;">
                    📚 Le domande cambiano ogni volta che riprovi!
                </p>
                <div class="difficulty-selector">
                    <button class="difficulty-btn" onclick="startGame('facile')">
                        🟢 FACILE<br>Numeri semplici
                    </button>
                    <button class="difficulty-btn" onclick="startGame('medio')">
                        🟡 MEDIO<br>Calcoli intermedi
                    </button>
                    <button class="difficulty-btn" onclick="startGame('difficile')">
                        🔴 DIFFICILE<br>Sfida completa
                    </button>
                </div>
                <div id="rankingPreview" style="margin-top: 50px;"></div>
            </div>
        </div>

        <!-- SCHERMATA GIOCO -->
        <div class="screen" id="gameScreen">
            <div class="header">
                <div class="title">⚛️ ESCAPE ROOM FISICA</div>
                <div class="subtitle" id="difficultyLabel"></div>
            </div>

            <div class="stats-bar">
                <div class="stat">
                    <span>⏱️ TEMPO:</span>
                    <div class="timer" id="timer">45:00</div>
                </div>
                <div class="stat">
                    <span>⭐ PUNTI:</span>
                    <div class="points-display" id="points">0</div>
                </div>
                <div class="stat" id="levelIndicator">
                    <span class="level-indicator level-1">LIVELLO 1</span>
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-label">
                    <span>AVANZAMENTO</span>
                    <span id="progressText">0/20</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="question-container" id="gameContainer">
                <!-- Domande generate dinamicamente -->
            </div>
        </div>

        <!-- SCHERMATA VITTORIA -->
        <div class="screen" id="victoryScreen">
            <div class="victory-emoji">🎓🎉</div>
            <div class="victory-title">MISSIONE COMPIUTA!</div>
            <div class="victory-message" id="victoryMessage">
                Complimenti, brillante fisico! 🌟
            </div>
            <div class="stats-final" id="finalStats"></div>
            <table class="ranking-table" id="rankingTable"></table>
            <button class="restart-btn" onclick="location.reload()">🔄 RIPROVA</button>
        </div>
    </div>

    <script>
        // GENERATORE DI DOMANDE PARAMETRICHE
        function generateQuestion(template, difficulty) {
            let q = JSON.parse(JSON.stringify(template));
            
            switch(q.id) {
                // Livello 1: Conversione velocità
                case 'L1Q1':
                    const velocities = difficulty === 'facile' ? [36, 72, 108] : difficulty === 'medio' ? [45, 90, 120] : [54, 99, 126];
                    const vel = velocities[Math.floor(Math.random() * velocities.length)];
                    q.text = `Converti ${vel} km/h in m/s (rispondi con il numero)`;
                    q.answer = String(vel / 3.6).split('.')[0];
                    q.explanation = `Per convertire km/h in m/s si divide per 3.6: ${vel} ÷ 3.6 = ${q.answer}`;
                    break;

                // Livello 1: Modulo di vettore
                case 'L1Q2':
                    let fx, fy, result;
                    if (difficulty === 'facile') {
                        fx = 3; fy = 4; result = 5;
                    } else if (difficulty === 'medio') {
                        fx = 6; fy = 8; result = 10;
                    } else {
                        fx = 5; fy = 12; result = 13;
                    }
                    q.text = `Modulo di un vettore con Fx = ${fx} N e Fy = ${fy} N (solo numero)`;
                    q.answer = String(result);
                    q.explanation = `Modulo = √(Fx² + Fy²) = √(${fx}² + ${fy}²) = √(${fx*fx + fy*fy}) = ${result}`;
                    break;

                // Livello 1: Cifre significative
                case 'L1Q3':
                    const numbers = difficulty === 'facile' ? ['0,00450', '0,0025', '0,0035'] : difficulty === 'medio' ? ['0,001250', '0,00456', '0,010200'] : ['0,00120300', '0,0010050', '0,000456'];
                    const num = numbers[Math.floor(Math.random() * numbers.length)];
                    const sigFigs = difficulty === 'facile' ? 3 : difficulty === 'medio' ? 4 : Math.floor(Math.random() * 3) + 4;
                    q.text = `Quante cifre significative ha il numero ${num}? (rispondi con il numero)`;
                    q.answer = String(sigFigs);
                    q.explanation = `Le cifre significative partono dal primo numero diverso da zero. In ${num}, le cifre significative sono ${sigFigs}`;
                    break;

                // Livello 2: Velocità media
                case 'L2Q1':
                    let spazio, tempo, velocita;
                    if (difficulty === 'facile') {
                        spazio = 12; tempo = 3; velocita = 4;
                    } else if (difficulty === 'medio') {
                        spazio = 20; tempo = 4; velocita = 5;
                    } else {
                        spazio = 25; tempo = 4; velocita = 6.25;
                    }
                    q.text = `Un carrello percorre ${spazio} m in ${tempo} s. Velocità media (solo numero)`;
                    q.answer = String(velocita === Math.floor(velocita) ? velocita : velocita.toFixed(2)).replace('.', ',');
                    q.explanation = `v = spazio / tempo = ${spazio} / ${tempo} = ${velocita}`;
                    break;

                // Livello 2: Spazio in MRUA
                case 'L2Q2':
                    let acc, t, s;
                    if (difficulty === 'facile') {
                        acc = 2; t = 4; s = 16;
                    } else if (difficulty === 'medio') {
                        acc = 3; t = 4; s = 24;
                    } else {
                        acc = 2.5; t = 6; s = 45;
                    }
                    q.text = `Spazio percorso da un corpo da fermo con a = ${acc} m/s² per t = ${t} s (solo numero)`;
                    q.answer = String(s);
                    q.explanation = `s = ½at² = ½ × ${acc} × ${t}² = ½ × ${acc} × ${t*t} = ${s}`;
                    break;

                // Livello 3: F = ma
                case 'L3Q1':
                    let force, mass, accel;
                    if (difficulty === 'facile') {
                        force = 20; mass = 4; accel = 5;
                    } else if (difficulty === 'medio') {
                        force = 30; mass = 5; accel = 6;
                    } else {
                        force = 25; mass = 4; accel = 6.25;
                    }
                    q.text = `Accelerazione da una forza di ${force} N su un corpo di ${mass} kg (solo numero)`;
                    q.answer = String(accel === Math.floor(accel) ? accel : accel.toFixed(2));
                    q.explanation = `a = F / m = ${force} / ${mass} = ${accel}`;
                    break;

                // Livello 3: Peso
                case 'L3Q2':
                    let massa, peso;
                    if (difficulty === 'facile') {
                        massa = 5; peso = 50;
                    } else if (difficulty === 'medio') {
                        massa = 8; peso = 80;
                    } else {
                        massa = 7.5; peso = 75;
                    }
                    q.text = `Peso sulla Terra di una massa di ${massa} kg (g = 10 m/s²) (solo numero)`;
                    q.answer = String(peso);
                    q.explanation = `P = mg = ${massa} × 10 = ${peso}`;
                    break;

                // Livello 4: Energia potenziale
                case 'L4Q1':
                    let m, h, ep;
                    if (difficulty === 'facile') {
                        m = 2; h = 5; ep = 100;
                    } else if (difficulty === 'medio') {
                        m = 3; h = 10; ep = 300;
                    } else {
                        m = 4; h = 12.5; ep = 500;
                    }
                    q.text = `Energia potenziale di un blocco di ${m} kg sollevato a ${h} m (g = 10 m/s²) (solo numero)`;
                    q.answer = String(ep);
                    q.explanation = `ΔEp = mgh = ${m} × 10 × ${h} = ${ep}`;
                    break;

                // Livello 4: Energia cinetica
                case 'L4Q2':
                    let m_auto, v_auto, ec;
                    if (difficulty === 'facile') {
                        m_auto = 1000; v_auto = 10; ec = 50000;
                    } else if (difficulty === 'medio') {
                        m_auto = 1500; v_auto = 10; ec = 75000;
                    } else {
                        m_auto = 2000; v_auto = 15; ec = 225000;
                    }
                    q.text = `Energia cinetica di un'auto di ${m_auto} kg a ${v_auto} m/s (solo numero)`;
                    q.answer = String(ec);
                    q.explanation = `Ek = ½mv² = ½ × ${m_auto} × ${v_auto}² = ½ × ${m_auto} × ${v_auto*v_auto} = ${ec}`;
                    break;

                // Livello 4: Potenza
                case 'L4Q3':
                    let lavoro, tempo_p, potenza;
                    if (difficulty === 'facile') {
                        lavoro = 200; tempo_p = 4; potenza = 50;
                    } else if (difficulty === 'medio') {
                        lavoro = 300; tempo_p = 5; potenza = 60;
                    } else {
                        lavoro = 400; tempo_p = 8; potenza = 50;
                    }
                    q.text = `Potenza di un lavoro di ${lavoro} J in ${tempo_p} secondi (solo numero)`;
                    q.answer = String(potenza);
                    q.explanation = `P = L / t = ${lavoro} / ${tempo_p} = ${potenza}`;
                    break;
            }
            
            return q;
        }

        // TEMPLATE DOMANDE
        const questionTemplates = [
            { id: 'L1Q1', level: 1, number: 1, type: 'conversion' },
            { id: 'L1Q2', level: 1, number: 2, type: 'vector' },
            { id: 'L1Q3', level: 1, number: 3, type: 'sigfigs' },
            { id: 'L2Q1', level: 2, number: 4, type: 'velocity' },
            { id: 'L2Q2', level: 2, number: 5, type: 'mrua' },
            { id: 'L3Q1', level: 3, number: 6, type: 'newton2' },
            { id: 'L3Q2', level: 3, number: 7, type: 'weight' },
            { id: 'L4Q1', level: 4, number: 8, type: 'epotential' },
            { id: 'L4Q2', level: 4, number: 9, type: 'ekinetic' },
            { id: 'L4Q3', level: 4, number: 10, type: 'power' }
        ];

        let currentQuestionIndex = 0;
        let questions = [];
        let startTime = 0;
        let timeRemaining = 45 * 60;
        let currentDifficulty = 'medio';
        let totalPoints = 0;
        let questionStartTime = 0;
        let ranking = JSON.parse(localStorage.getItem('physicsRanking')) || [];

        function startGame(difficulty) {
            currentDifficulty = difficulty;
            document.getElementById('difficultyScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');
            
            // Genera domande per questa sessione (raddoppiate per varietà)
            questions = [];
            for (let i = 0; i < 2; i++) {
                for (let template of questionTemplates) {
                    questions.push(generateQuestion(template, difficulty));
                }
            }
            
            // Mescola e prendi le prime 20
            questions = questions.sort(() => Math.random() - 0.5).slice(0, 20);

            document.getElementById('difficultyLabel').textContent = `Difficoltà: ${difficulty.toUpperCase()}`;
            
            startTime = Date.now();
            currentQuestionIndex = 0;
            totalPoints = 0;
            
            // Mostra messaggio iniziale
            document.getElementById('gameContainer').innerHTML = `
                <div style="text-align: center; padding: 40px; color: #00ff88; font-size: 1.2em; line-height: 1.8;">
                    <div style="color: #ffaa00; font-size: 1.3em; margin-bottom: 20px;">💡 IMPORTANTE</div>
                    <div>Rispondi con il <strong>NUMERO SOLO</strong></div>
                    <div style="color: #0088ff; font-size: 1em; margin-top: 15px;">Senza unità di misura!</div>
                    <div style="margin-top: 30px;">Esempio: <strong>20</strong> anziché "20 m/s"</div>
                    <button onclick="startFirstQuestion()" style="margin-top: 30px; padding: 12px 40px; font-size: 1.1em;">
                        ✓ HO CAPITO - INIZIA
                    </button>
                </div>
            `;
        }

        function startFirstQuestion() {
            renderQuestion();
            startTimer();
        }

        function renderQuestion() {
            const container = document.getElementById('gameContainer');
            const q = questions[currentQuestionIndex];
            
            questionStartTime = Date.now();
            
            container.innerHTML = `
                <div class="question-number">
                    DOMANDA ${currentQuestionIndex + 1}/20 | LIVELLO ${q.level}
                </div>
                <div class="question-text">${q.text}</div>
                <div class="input-group">
                    <input type="text" id="answerInput" placeholder="Digita la risposta..." autocomplete="off">
                    <button onclick="checkAnswer()">INVIA</button>
                </div>
                <div id="feedback"></div>
            `;
            
            updateLevelIndicator();
            updateProgress();
            
            setTimeout(() => document.getElementById('answerInput').focus(), 100);
            document.getElementById('answerInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') checkAnswer();
            });
        }

        function checkAnswer() {
            const input = document.getElementById('answerInput');
            const q = questions[currentQuestionIndex];
            const userAnswer = input.value.trim().toLowerCase().replace(',', '.');
            const correctAnswer = q.answer.toLowerCase().replace(',', '.');
            
            const feedback = document.getElementById('feedback');
            
            // Tolleranza per numeri decimali
            let isCorrect = userAnswer === correctAnswer;
            if (!isCorrect && !isNaN(userAnswer) && !isNaN(correctAnswer)) {
                isCorrect = Math.abs(parseFloat(userAnswer) - parseFloat(correctAnswer)) < 0.01;
            }
            
            if (isCorrect) {
                input.classList.remove('error');
                input.classList.add('correct');
                feedback.className = 'feedback success';
                
                // Calcola punti (bonus velocità)
                const timeTaken = (Date.now() - questionStartTime) / 1000;
                let points = 100;
                if (timeTaken < 10) points += 50;
                else if (timeTaken < 20) points += 25;
                
                totalPoints += points;
                document.getElementById('points').textContent = totalPoints;
                
                feedback.innerHTML = `✓ RISPOSTA CORRETTA! +${points} punti`;
                
                setTimeout(() => {
                    currentQuestionIndex++;
                    if (currentQuestionIndex < questions.length) {
                        renderQuestion();
                    } else {
                        showVictoryScreen();
                    }
                }, 800);
            } else {
                input.classList.remove('correct');
                input.classList.add('error');
                feedback.className = 'feedback error';
                feedback.innerHTML = `
                    <div>✗ RISPOSTA ERRATA</div>
                    <div class="explanation">
                        <div class="explanation-title">📚 Spiegazione:</div>
                        ${q.explanation}
                    </div>
                `;
                input.value = '';
                setTimeout(() => input.focus(), 300);
            }
        }

        function updateProgress() {
            const progress = currentQuestionIndex;
            const percentage = (progress / questions.length) * 100;
            document.getElementById('progressFill').style.width = percentage + '%';
            document.getElementById('progressText').textContent = `${progress}/20`;
        }

        function updateLevelIndicator() {
            const level = questions[currentQuestionIndex].level;
            const indicator = document.getElementById('levelIndicator');
            const levelClass = `level-${level}`;
            indicator.innerHTML = `<span class="level-indicator ${levelClass}">LIVELLO ${level}</span>`;
        }

        function startTimer() {
            const timerEl = document.getElementById('timer');
            
            setInterval(() => {
                timeRemaining--;
                
                if (timeRemaining < 0) timeRemaining = 0;
                
                const minutes = Math.floor(timeRemaining / 60);
                const seconds = timeRemaining % 60;
                const display = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                timerEl.textContent = display;
                
                if (timeRemaining < 300) {
                    timerEl.classList.add('critical');
                } else {
                    timerEl.classList.remove('critical');
                }
            }, 1000);
        }

        function showVictoryScreen() {
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('victoryScreen').classList.add('active');
            
            const totalTime = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(totalTime / 60);
            const seconds = totalTime % 60;
            
            // Calcola bonus finale
            const timeBonus = Math.max(0, 600 - totalTime) * 2;
            const finalScore = totalPoints + timeBonus;
            
            // Aggiungi al ranking
            const entry = {
                name: `Sessione ${new Date().toLocaleString()}`,
                difficulty: currentDifficulty,
                score: finalScore,
                time: `${minutes}:${String(seconds).padStart(2, '0')}`
            };
            ranking.push(entry);
            ranking.sort((a, b) => b.score - a.score);
            ranking = ranking.slice(0, 10);
            localStorage.setItem('physicsRanking', JSON.stringify(ranking));
            
            document.getElementById('victoryMessage').innerHTML = `
                Complimenti! 🌟<br>
                Hai completato l'escape room con successo!<br>
                Difficoltà: ${currentDifficulty.toUpperCase()}
            `;
            
            const finalStats = document.getElementById('finalStats');
            finalStats.innerHTML = `
                <div class="stats-line">
                    <span>⏱️ Tempo impiegato:</span>
                    <span>${minutes}:${String(seconds).padStart(2, '0')}</span>
                </div>
                <div class="stats-line">
                    <span>⭐ Punti da risposte:</span>
                    <span>${totalPoints}</span>
                </div>
                <div class="stats-line">
                    <span>⚡ Bonus velocità:</span>
                    <span>+${Math.round(timeBonus)}</span>
                </div>
                <div class="stats-line" style="font-size: 1.3em; color: #ffaa00; border-top: 1px solid #00ff88; padding-top: 10px; margin-top: 10px;">
                    <span>🏆 PUNTEGGIO TOTALE:</span>
                    <span>${Math.round(finalScore)}</span>
                </div>
            `;
            
            // Mostra ranking
            const rankingTable = document.getElementById('rankingTable');
            rankingTable.innerHTML = `
                <thead>
                    <tr>
                        <th>🥇 Posizione</th>
                        <th>📊 Difficoltà</th>
                        <th>🏆 Punti</th>
                        <th>⏱️ Tempo</th>
                    </tr>
                </thead>
                <tbody>
                    ${ranking.map((r, i) => `
                        <tr>
                            <td>${i + 1}${i === 0 ? ' 👑' : ''}</td>
                            <td>${r.difficulty}</td>
                            <td>${Math.round(r.score)}</td>
                            <td>${r.time}</td>
                        </tr>
                    `).join('')}
                </tbody>
            `;
        }

        // Mostra ranking all'inizio
        function showDifficultyScreen() {
            const preview = document.getElementById('rankingPreview');
            if (ranking.length > 0) {
                preview.innerHTML = `
                    <h3 style="color: #00ff88; margin-bottom: 15px;">🏆 TOP 5 MIGLIORI PUNTEGGI</h3>
                    <table class="ranking-table">
                        <thead>
                            <tr>
                                <th>Pos.</th>
                                <th>Difficoltà</th>
                                <th>Punti</th>
                                <th>Tempo</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${ranking.slice(0, 5).map((r, i) => `
                                <tr>
                                    <td>${i + 1}${i === 0 ? ' 👑' : ''}</td>
                                    <td>${r.difficulty}</td>
                                    <td>${Math.round(r.score)}</td>
                                    <td>${r.time}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            }
        }

        showDifficultyScreen();
    </script>
</body>
</html>
